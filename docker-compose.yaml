services:

  init-data:
    image: alpine:3.18
    command: sh -c "mkdir -p /data/hls"
    volumes:
      - ./data:/data
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis.conf
    restart: unless-stopped
    volumes:
      - ./redis.conf:/etc/redis.conf
      - redis_data:/data
    ports:
      - "6379:6379"
    depends_on:
      - init-data

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - ./data:/data
    depends_on:
      - redis
      - init-data
    cap_add:
      - SYS_ADMIN
    ports:
      - "7880:7880"   # API
      - "7881:7881"   # RTC TCP
      - "50100-50110:50100-50110/udp"   # RTC UDP

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
      - ./data:/data
    depends_on:
      - livekit
      - init-data
    cap_add:
      - SYS_ADMIN
    ports:
      - "7882:7882"

  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    environment:
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml
      - ./data:/data
    depends_on:
      - livekit
      - init-data
    cap_add:
      - SYS_ADMIN
    ports:
      - "1935:1935"
      - "8080:8080"
      - "7884:7884"

  sip:
    image: livekit/sip:latest
    command: --config /etc/sip.yaml
    restart: unless-stopped
    volumes:
      - ./sip.yaml:/etc/sip.yaml
      - ./data:/data
    depends_on:
      - livekit
      - redis
      - init-data
    environment:
      - SIP_CONFIG_FILE=/etc/sip.yaml
    ports:
      - "5060:5060/udp"
      - "8081:8081"

  caddy:
    image: livekit/caddyl4
    command: run --config /etc/caddy.yaml --adapter yaml
    restart: unless-stopped
    volumes:
      - ./caddy.yaml:/etc/caddy.yaml
      - ./data:/data
    depends_on:
      - init-data
    ports:
      - "8085:8085"

volumes:
  redis_data:
